<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register – TicketEase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0d47a1 0%,#1565c0 50%,#1976d2 100%);padding:20px}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18}
.b1{width:400px;height:400px;background:#42a5f5;top:-100px;left:-100px}
.b2{width:350px;height:350px;background:#7e57c2;bottom:-80px;right:-80px}
.card{background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.28);width:460px;padding:40px;position:relative;z-index:1}
.brand{text-align:center;margin-bottom:26px}
.brand .icon{font-size:40px;display:block;margin-bottom:6px}
.brand h1{color:#0d47a1;font-size:22px;font-weight:800}
.brand p{color:#888;font-size:12px;margin-top:3px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:2px solid #e8eaf6;border-radius:10px;font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1565c0;box-shadow:0 0 0 4px rgba(21,101,192,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s;margin-top:6px}
.btn-primary:hover{transform:translateY(-2px)}
.alert-error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.link-row{text-align:center;font-size:13px;color:#666;margin-top:18px}
.link-row a{color:#1565c0;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="card">
  <div class="brand"><span class="icon">🎫</span><h1>Create Account</h1><p>Join TicketEase today</p></div>
  <div th:if="${error}" class="alert-error" th:text="${error}"></div>
  <form method="post" th:action="@{/register}">
    <div class="form-group"><label>Full Name</label><input type="text" name="fullName" required placeholder="Your full name" autofocus></div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" placeholder="10-digit mobile"></div>
    </div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required placeholder="Min. 6 characters"></div>
    <div class="form-group">
      <label>Role</label>
      <select name="role" required>
        <option value="">Select role</option>
        <option value="ROLE_CUSTOMER">Customer</option>
        <option value="ROLE_AGENT">Agent</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Create Account →</button>
  </form>
  <div class="link-row">Already have an account? <a th:href="@{/login}">Sign in</a></div>
</div>
</body></html>
