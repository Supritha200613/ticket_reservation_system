<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login – TicketEase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0d47a1 0%,#1565c0 50%,#1976d2 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18}
.b1{width:400px;height:400px;background:#42a5f5;top:-100px;left:-100px}
.b2{width:350px;height:350px;background:#7e57c2;bottom:-80px;right:-80px}
.card{background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.28);width:420px;padding:44px 40px;position:relative;z-index:1}
.brand{text-align:center;margin-bottom:28px}
.brand .icon{font-size:48px;display:block;margin-bottom:8px}
.brand h1{color:#0d47a1;font-size:26px;font-weight:800}
.brand p{color:#888;font-size:13px;margin-top:4px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:7px}
.form-group input{width:100%;padding:12px 16px;border:2px solid #e8eaf6;border-radius:10px;font-size:14px;transition:border .2s,box-shadow .2s}
.form-group input:focus{outline:none;border-color:#1565c0;box-shadow:0 0 0 4px rgba(21,101,192,.1)}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:6px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,71,161,.35)}
.alert-error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px}
.divider{text-align:center;color:#bbb;font-size:13px;margin:20px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#eee}
.divider::before{left:0}.divider::after{right:0}
.link-row{text-align:center;font-size:13px;color:#666;margin-top:18px}
.link-row a{color:#1565c0;font-weight:700;text-decoration:none}
.demo-creds{background:#e3f2fd;border-radius:10px;padding:14px 16px;margin-top:20px;font-size:12px;color:#1565c0}
.demo-creds strong{display:block;margin-bottom:6px;font-size:13px}
.demo-creds span{display:block;line-height:1.8}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="card">
  <div class="brand"><span class="icon">🎫</span><h1>TicketEase</h1><p>Online Ticket Reservation System</p></div>
  <div th:if="${error}" class="alert-error" th:text="${error}"></div>
  <form method="post" th:action="@{/login}">
    <div class="form-group"><label>Email Address</label><input type="email" name="email" required placeholder="you@example.com" autofocus></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required placeholder="Enter your password"></div>
    <button type="submit" class="btn-primary">Sign In →</button>
  </form>
  <div class="divider">or</div>
  <div class="link-row">New to TicketEase? <a th:href="@{/register}">Create account</a></div>
  <div class="demo-creds">
    <strong>🔑 Demo credentials</strong>
    <span>Admin: admin@ticketease.com / admin123</span>
    <span>Customer: customer@ticketease.com / customer123</span>
  </div>
</div>
</body></html>
