<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile – TicketEase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.navbar{background:linear-gradient(135deg,#0d47a1,#1565c0);padding:0 30px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.22);position:sticky;top:0;z-index:100}
.navbar .brand{color:#fff;font-size:20px;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:8px}
.navbar .nav-links{display:flex;align-items:center;gap:6px}
.navbar .nav-links a{color:rgba(255,255,255,.88);text-decoration:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;transition:background .2s}
.navbar .nav-links a:hover,.navbar .nav-links a.active{background:rgba(255,255,255,.22);color:#fff}
.page{max-width:960px;margin:28px auto;padding:0 22px}
.flash{border-radius:10px;padding:13px 18px;margin-bottom:20px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px}
.flash.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.flash.error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden;margin-bottom:22px}
.card-header{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;padding:18px 24px}
.card-header h2{font-size:16px;font-weight:700}
.card-header p{font-size:12px;opacity:.8;margin-top:3px}
.card-body{padding:24px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1565c0,#0d47a1);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin:0 auto 14px}
.profile-meta{text-align:center;margin-bottom:28px}
.profile-meta h2{font-size:22px;font-weight:700;color:#222}
.profile-meta .badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.badge-admin{background:#fce4ec;color:#c62828}
.badge-agent{background:#e8f5e9;color:#2e7d32}
.badge-customer{background:#e3f2fd;color:#1565c0}
.badge-confirmed{background:#e8f5e9;color:#2e7d32}
.badge-cancelled{background:#ffebee;color:#c62828}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:7px}
.form-group input{width:100%;padding:11px 14px;border:2px solid #e8eaf6;border-radius:10px;font-size:14px;transition:border .2s}
.form-group input:focus{outline:none;border-color:#1565c0;box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.btn-success{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}
.info-item .label{font-size:12px;color:#888;margin-bottom:4px}
.info-item .val{font-size:14px;font-weight:600;color:#222}
</style>
</head>
<body>
<nav class="navbar">
  <a th:href="@{/dashboard}" class="brand">🎫 TicketEase</a>
  <div class="nav-links">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/schedules}">Search</a>
    <a th:href="@{/bookings/my}">My Bookings</a>
    <a th:href="@{/profile}" class="active">Profile</a>
    <a th:href="@{/logout}">Logout</a>
  </div>
</nav>
<div class="page">
  <div th:if="${success}" class="flash success">✅ <span th:text="${success}"></span></div>
  <div th:if="${passwordError}" class="flash error">❌ <span th:text="${passwordError}"></span></div>

  <div class="profile-meta">
    <div class="avatar">👤</div>
    <h2 th:text="${user.fullName}"></h2>
    <span th:class="${user.role.name() == 'ROLE_ADMIN'} ? 'badge badge-admin' :
                     (${user.role.name() == 'ROLE_AGENT'} ? 'badge badge-agent' : 'badge badge-customer')"
          th:text="${user.role.name()}"></span>
  </div>

  <div class="profile-grid">
    <div class="card">
      <div class="card-header"><h2>✏️ Edit Profile</h2><p>Update your personal information</p></div>
      <div class="card-body">
        <form method="post" th:action="@{/profile/update}">
          <div class="form-group"><label>Full Name</label><input type="text" name="fullName" required th:value="${user.fullName}"></div>
          <div class="form-group"><label>Email (read-only)</label><input type="email" th:value="${user.email}" disabled style="background:#f5f5f5;color:#999"></div>
          <div class="form-group"><label>Phone</label><input type="text" name="phone" th:value="${user.phone}" placeholder="Mobile number"></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>🔒 Change Password</h2><p>Keep your account secure</p></div>
      <div class="card-body">
        <form method="post" th:action="@{/profile/change-password}">
          <div class="form-group"><label>Current Password</label><input type="password" name="currentPassword" required placeholder="Your current password"></div>
          <div class="form-group"><label>New Password</label><input type="password" name="newPassword" required placeholder="Min. 6 characters"></div>
          <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirmPassword" required placeholder="Repeat new password"></div>
          <button type="submit" class="btn btn-success">Change Password</button>
        </form>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>📋 Account Details</h2></div>
    <div class="card-body">
      <div class="info-grid">
        <div class="info-item"><div class="label">User ID</div><div class="val" th:text="${user.id}"></div></div>
        <div class="info-item"><div class="label">Email</div><div class="val" th:text="${user.email}"></div></div>
        <div class="info-item"><div class="label">Phone</div><div class="val" th:text="${user.phone != null ? user.phone : '—'}"></div></div>
        <div class="info-item"><div class="label">Role</div><div class="val" th:text="${user.role.name()}"></div></div>
        <div class="info-item"><div class="label">Status</div>
          <span th:if="${user.enabled}" class="badge badge-confirmed">✓ Active</span>
          <span th:unless="${user.enabled}" class="badge badge-cancelled">Disabled</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
