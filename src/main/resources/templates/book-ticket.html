<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Book Ticket – TicketEase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.navbar{background:linear-gradient(135deg,#0d47a1,#1565c0);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.22);position:sticky;top:0;z-index:100}
.navbar .brand{color:#fff;font-size:20px;font-weight:800;text-decoration:none}
.navbar .nav-links{display:flex;align-items:center;gap:5px}
.navbar .nav-links a{color:rgba(255,255,255,.88);text-decoration:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;transition:background .2s}
.navbar .nav-links a:hover,.navbar .nav-links a.active{background:rgba(255,255,255,.22);color:#fff}
.page{max-width:1180px;margin:28px auto;padding:0 22px}
.flash{border-radius:10px;padding:13px 18px;margin-bottom:20px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px}
.flash.success{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.flash.error{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}
.flash.info{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden;margin-bottom:22px}
.card-header{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-size:16px;font-weight:700}
.card-header p{font-size:12px;opacity:.8;margin-top:3px}
.card-header a{color:#fff;font-size:12px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:6px;text-decoration:none}
.card-body{padding:24px}
.page-title{font-size:22px;font-weight:800;color:#0d47a1;margin-bottom:22px;display:flex;align-items:center;gap:10px}
.section-title{font-size:15px;font-weight:700;color:#0d47a1;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #e3f2fd}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:linear-gradient(135deg,#1565c0,#0d47a1)}
th{padding:13px 16px;text-align:left;color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-size:13px;color:#333;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fbff}
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700}
.badge-confirmed{background:#e8f5e9;color:#2e7d32}
.badge-cancelled{background:#ffebee;color:#c62828}
.badge-pending{background:#fff3e0;color:#e65100}
.badge-paid{background:#e8f5e9;color:#2e7d32}
.badge-refunded{background:#e8eaf6;color:#3949ab}
.badge-unpaid{background:#fff3e0;color:#e65100}
.badge-bus{background:#e8f5e9;color:#2e7d32}
.badge-train{background:#e3f2fd;color:#1565c0}
.badge-flight{background:#fff3e0;color:#e65100}
.btn{display:inline-block;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.btn-success{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff}
.btn-danger{background:#c62828;color:#fff}
.btn-light{background:#f5f5f5;color:#333;border:1px solid #e0e0e0}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:7px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:2px solid #e8eaf6;border-radius:10px;font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1565c0;box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;gap:10px;margin-top:24px}
.empty{text-align:center;padding:60px 20px;color:#aaa}
.empty .icon{font-size:52px;display:block;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.journey-card{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff;border-radius:14px;padding:24px;margin-bottom:0}
.journey-card h3{font-size:16px;font-weight:700;margin-bottom:18px;opacity:.9}
.jrow{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.jblock .jtime{font-size:26px;font-weight:800}
.jblock .jcity{font-size:13px;opacity:.75;margin-top:2px}
.jarrow{flex:1;text-align:center;font-size:22px;opacity:.6}
.jmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.jmeta-item .lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.jmeta-item .val{font-size:13px;font-weight:600}
.fare-box{background:rgba(255,255,255,.15);border-radius:10px;padding:14px 18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.fare-box .amount{font-size:26px;font-weight:800}
.fare-box .note{font-size:12px;opacity:.75}
.progress-bar{display:flex;justify-content:center;gap:0;margin-bottom:24px}
.step{display:flex;align-items:center;gap:0}
.step-dot{width:32px;height:32px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#888}
.step-dot.done{background:#2e7d32;color:#fff}
.step-dot.active{background:#1565c0;color:#fff}
.step-label{font-size:12px;color:#888;margin:0 8px}
.step-line{width:50px;height:2px;background:#e0e0e0}
.step-line.done{background:#2e7d32}
</style></head>
<body>
<nav class="navbar">
  <a th:href="@{/dashboard}" class="brand">🎫 TicketEase</a>
  <div class="nav-links">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/schedules}">Search Trips</a>
    <a th:href="@{/bookings/my}">My Bookings</a>
    <a th:if="${userRole == 'ROLE_ADMIN' or userRole == 'ROLE_AGENT'}" th:href="@{/admin}">Admin Panel</a>
    <a th:href="@{/profile}">Profile</a>
    <a th:href="@{/logout}">Logout</a>
  </div>
</nav>
<div class="page">
  <div class="page-title">🎫 Book Ticket</div>

  <div class="progress-bar">
    <div class="step"><div class="step-dot done">1</div><span class="step-label">Select Trip</span></div>
    <div class="step-line done"></div>
    <div class="step"><div class="step-dot active">2</div><span class="step-label">Passenger Details</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">3</div><span class="step-label">Payment</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">4</div><span class="step-label">Confirmation</span></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-header"><h2>Passenger Details</h2><p>Fill in the traveller information</p></div>
      <div class="card-body">
        <div th:if="${error}" class="flash error">❌ <span th:text="${error}"></span></div>
        <form method="post" th:action="@{/bookings/book/{id}(id=${schedule.id})}">
          <div class="form-group"><label>Passenger Full Name</label><input type="text" name="passengerName" required placeholder="Full name as on ID"></div>
          <div class="form-row">
            <div class="form-group"><label>Age</label><input type="number" name="passengerAge" required placeholder="Age" min="1" max="120"></div>
            <div class="form-group"><label>Gender</label>
              <select name="passengerGender" required>
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>ID Proof Type</label>
              <select name="idType" required>
                <option value="">Select ID</option>
                <option value="AADHAAR">Aadhaar Card</option>
                <option value="PASSPORT">Passport</option>
                <option value="DL">Driving Licence</option>
              </select>
            </div>
            <div class="form-group"><label>ID Number</label><input type="text" name="idNumber" required placeholder="Government ID number"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Number of Seats</label>
              <input type="number" name="seatsBooked" id="seatsCount" required value="1" min="1" th:max="${schedule.availableSeats}" oninput="updateFare()">
            </div>
            <div class="form-group"><label>Seat Numbers (comma-separated)</label>
              <input type="text" name="seatNumbers" required placeholder="e.g. A1 or A1,A2"></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="flex:1;padding:13px;font-size:15px">Proceed to Payment →</button>
            <a th:href="@{/schedules}" class="btn btn-light">← Back</a>
          </div>
        </form>
      </div>
    </div>

    <div>
      <div class="journey-card">
        <h3>🚌 Journey Summary</h3>
        <div class="jrow">
          <div class="jblock"><div class="jtime" th:text="${#temporals.format(schedule.departureTime,'HH:mm')}"></div><div class="jcity" th:text="${schedule.route.source}"></div></div>
          <div class="jarrow">→</div>
          <div class="jblock"><div class="jtime" th:text="${#temporals.format(schedule.arrivalTime,'HH:mm')}"></div><div class="jcity" th:text="${schedule.route.destination}"></div></div>
        </div>
        <div class="jmeta">
          <div class="jmeta-item"><div class="lbl">Date</div><div class="val" th:text="${#temporals.format(schedule.departureTime,'dd MMM yyyy')}"></div></div>
          <div class="jmeta-item"><div class="lbl">Operator</div><div class="val" th:text="${schedule.operatorName}"></div></div>
          <div class="jmeta-item"><div class="lbl">Vehicle</div><div class="val" th:text="${schedule.vehicleNumber}"></div></div>
          <div class="jmeta-item"><div class="lbl">Available</div><div class="val" th:text="${schedule.availableSeats} + ' seats'"></div></div>
        </div>
        <div class="fare-box">
          <div><div class="note">Total Fare</div><div class="amount">₹<span id="totalFare" th:text="${schedule.route.baseFare}"></span></div></div>
          <div class="note">₹<span th:text="${schedule.route.baseFare}"></span>/seat</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
var baseFare = parseFloat(document.querySelector('[th\\:text*="baseFare"]') ? 0 : 0);
// Simple fare update
document.getElementById('seatsCount').addEventListener('input', function() {
  // fare display update handled server-side on submit
});
</script>
</body></html>
